<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>FIZZ DEV</title>
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="assets/dev.css" />
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="assets/core.js"></script>
</head>
<body>
  <!-- ============ APP ============ -->
  <div id="app" class="app">
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <a href="index.html" aria-label="FIZZ home"><img src="logo.png" alt="fizz dev" class="side-logo" /></a>
        <button class="pill" id="new-project-btn"><span class="plus">+</span> New project</button>
      </div>
      <nav class="projects" id="project-list" aria-label="Projects"></nav>
      <div class="side-bottom">
        <button class="avatar" id="avatar-btn" aria-label="Account"></button>
        <label class="search pill">
          <input id="search" placeholder="Search..." aria-label="Search projects and chats" />
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </label>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menu-btn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <img src="logo.png" alt="fizz dev" class="top-logo mobile-only" />
        <div class="crumbs" id="crumbs"></div>
        <div class="top-actions">
          <div class="view-switch hidden" id="view-switch">
            <button data-view="chat" class="active">Chat</button>
            <button data-view="code">Code</button>
            <button data-view="preview">Preview</button>
          </div>
          <button class="icon-btn" id="new-chat-btn" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m14 6 4 4"/></svg></button>
          <div class="menu-wrap">
            <button class="icon-btn" id="more-btn" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
            <div class="menu hidden" id="more-menu">
              <button data-action="chat">Open FIZZ chat</button>
              <button data-action="settings">Settings</button>
              <button data-action="rename">Rename project</button>
              <button data-action="download">Download project (.zip)</button>
              <button data-action="delete-chat">Delete chat</button>
              <button data-action="delete-project" class="danger">Delete project</button>
              <hr />
              <button data-action="signout">Sign out</button>
            </div>
          </div>
        </div>
      </header>

      <!-- Chat view -->
      <section class="view view-chat" id="view-chat">
        <div class="messages" id="messages">
          <div class="empty" id="empty"><h1>How can I help you today?</h1></div>
        </div>
        <div class="composer-wrap">
          <div class="attachments" id="attachments"></div>
          <form class="composer" id="composer">
            <textarea id="prompt" rows="1" placeholder="Ask anything..." aria-label="Message"></textarea>
            <div class="composer-row">
              <button type="button" class="icon-btn" id="attach-btn" aria-label="Attach files"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
              <input type="file" id="file-input" multiple hidden />
              <div class="spacer"></div>
              <div class="menu-wrap">
                <button type="button" class="pill" id="model-btn">Fizz Code 1.0</button>
                <div class="menu up hidden" id="model-menu"></div>
              </div>
              <button type="submit" class="icon-btn send" id="send-btn" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
            </div>
          </form>
        </div>
      </section>

      <!-- Code view -->
      <section class="view view-code hidden" id="view-code">
        <div class="files-pane">
          <div class="files-head"><span>Files</span><button class="mini" id="new-file-btn">+ File</button></div>
          <div id="file-tree" class="file-tree"></div>
        </div>
        <div class="editor-pane">
          <div class="editor-head"><span id="editor-path">No file selected</span><span class="saved" id="saved-state"></span><button class="mini danger" id="delete-file-btn">Delete</button></div>
          <div class="editor"><pre class="gutter" id="gutter">1</pre><textarea id="editor" spellcheck="false" wrap="off" disabled></textarea></div>
        </div>
      </section>

      <!-- Preview view -->
      <section class="view view-preview hidden" id="view-preview">
        <div class="preview-bar">
          <div class="devices">
            <button data-w="100%" class="active">Desktop</button>
            <button data-w="820px">Tablet</button>
            <button data-w="390px">Phone</button>
          </div>
          <button class="mini" id="refresh-preview">Refresh</button>
          <button class="mini" id="open-preview">Open in new tab</button>
        </div>
        <div class="preview-stage"><iframe id="preview" title="Live preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div>
      </section>
    </main>
  </div>

  <!-- ============ DIALOGS ============ -->
  <dialog id="dlg-settings" class="dialog">
    <form method="dialog" id="settings-form">
      <h2>Settings</h2>
      <label>Name<input name="name" maxlength="60" /></label>
      <label>Anthropic API key
        <input name="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
        <small>Needed for Fizz Code to answer. It is stored only in this browser and sent only to api.anthropic.com. Get one at console.anthropic.com.</small>
      </label>
      <label>Custom instructions<textarea name="instructions" rows="3" maxlength="2000" placeholder="How should Fizz respond?"></textarea></label>
      <fieldset class="row-buttons">
        <button type="button" class="pill" id="export-data">Export my data</button>
        <button type="button" class="pill danger" id="delete-account">Delete account</button>
      </fieldset>
      <div class="dialog-actions"><button value="cancel" class="pill">Cancel</button><button value="save" class="pill pill-solid">Save</button></div>
    </form>
  </dialog>

  <dialog id="dlg-prompt" class="dialog">
    <form method="dialog">
      <h2 id="prompt-title"></h2>
      <p id="prompt-text" class="muted"></p>
      <input id="prompt-input" />
      <div class="dialog-actions"><button value="cancel" class="pill">Cancel</button><button value="ok" class="pill pill-solid" id="prompt-ok">OK</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/dev.js"></script>
</body>
</html>
