<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sign in · RanEddie ID</title>
<script>
/* Old FIZZ sign-in address. Signing in, signing up and password resets all happen on the official RanEddie ID site,
   https://id.raneddie.com, which then sends the person back to the FIZZ page they came from. */
(function () {
  var q = new URLSearchParams(location.search);
  var mode = q.get("mode");
  var path = mode === "signup" ? "/sign-up" : mode === "forgot" ? "/forgot-password" : "/sign-in";
  var r = q.get("redirect_url") || q.get("next") || "/chat.html";
  if (r.charAt(0) !== "/") r = "/" + r.replace(/^\/*/, "");
  if (r.charAt(1) === "/" || r.charAt(1) === "\\") r = "/chat.html";
  var url = "https://id.raneddie.com" + path + "?redirect_url=" + encodeURIComponent(location.origin + r);
  document.documentElement.setAttribute("data-to", url);
  location.replace(url);
})();
</script>
</head>
<body style="font:16px/1.6 system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#0b1220;color:#e6ebf5">
<main style="max-width:460px;padding:32px 24px;text-align:center">
  <p>Taking you to <b>RanEddie ID</b>, the official sign-in for every RanEddie product…</p>
  <p><a id="go" style="color:#7cc4ff" href="https://id.raneddie.com/sign-in">Continue to id.raneddie.com</a></p>
  <script>try { document.getElementById("go").href = document.documentElement.getAttribute("data-to"); } catch (e) {}</script>
</main>
</body>
</html>
